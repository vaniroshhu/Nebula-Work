<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Vacuum Agent Simulator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Three.js and OrbitControls via ES Modules / CDNs -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- React & Babel CDNs (for single-file browser transpilation) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      margin: 0;
      background-color: #020617;
      color: #f8fafc;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    canvas {
      display: block;
    }
    /* Slider improvements */
    input[type="range"]::-webkit-slider-thumb {
      background: #6366f1;
      border: 2px solid #ffffff;
      border-radius: 50%;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen overflow-hidden">
  <div id="root" class="h-full w-full"></div>

  <!-- React Code with Modern Babel Transpiler -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Standard direction movements helper
    const DIRECTIONS = [
      { dx: 0, dy: -1, name: 'North' }, // Up
      { dx: 1, dy: 0, name: 'East' },   // Right
      { dx: 0, dy: 1, name: 'South' },  // Down
      { dx: -1, dy: 0, name: 'West' }   // Left
    ];

    // BFS Search Implementation for nearest dirty spots or home base
    function findShortestPathBFS(start, targetCriteria, grid, gridSize) {
      const queue = [];
      const visited = new Set();
      const startKey = `${start.x},${start.y}`;
      visited.add(startKey);
      queue.push({ pos: start, path: [] });

      while (queue.length > 0) {
        const { pos, path } = queue.shift();
        const currentCell = grid[pos.y]?.[pos.x];

        if (currentCell && targetCriteria(currentCell) && (pos.x !== start.x || pos.y !== start.y)) {
          return path;
        }

        const neighbors = [];
        for (const dir of DIRECTIONS) {
          const nx = pos.x + dir.dx;
          const ny = pos.y + dir.dy;
          if (ny >= 0 && ny < grid.length && nx >= 0 && nx < (grid[ny]?.length || 0)) {
            if (grid[ny][nx].type !== 'obstacle') {
              neighbors.push({ x: nx, y: ny });
            }
          }
        }

        for (const neighbor of neighbors) {
          const neighborKey = `${neighbor.x},${neighbor.y}`;
          if (!visited.has(neighborKey)) {
            visited.add(neighborKey);
            queue.push({
              pos: neighbor,
              path: [...path, neighbor],
            });
          }
        }
      }
      return null;
    }

    // --- Three.js 3D Visualizer Component ---
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    function VacuumCanvas({ grid, gridSize, robotPos, dockPos, plannedPath, battery, showPaths, showQValues, onTileClick, agentType }) {
      const containerRef = useRef(null);
      const propsRef = useRef({ robotPos, dockPos, plannedPath, showPaths, showQValues, battery, gridSize });

      useEffect(() => {
        propsRef.current = { robotPos, dockPos, plannedPath, showPaths, showQValues, battery, gridSize };
      }, [robotPos, dockPos, plannedPath, showPaths, showQValues, battery, gridSize]);

      useEffect(() => {
        if (!containerRef.current) return;
        const width = containerRef.current.clientWidth;
        const height = containerRef.current.clientHeight || 550;

        // Scene, ISO Camera, and WebGL Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, gridSize * 1.3, gridSize * 1.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        containerRef.current.innerHTML = '';
        containerRef.current.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2.1;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);

        const spotLight = new THREE.DirectionalLight(0xf8fafc, 1.2);
        spotLight.position.set(10, 20, 15);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const CELL_SIZE = 1.2;
        const half = (gridSize - 1) / 2;
        const convertGridTo3D = (gx, gy) => ({ x: (gx - half) * CELL_SIZE, z: (gy - half) * CELL_SIZE });

        const tilesGroup = new THREE.Group();
        scene.add(tilesGroup);

        const gridMeshes = {};
        const dustParticlesGroup = {};
        const qValueVisualsGroup = new THREE.Group();
        scene.add(qValueVisualsGroup);

        const tileGeo = new THREE.BoxGeometry(CELL_SIZE * 0.94, 0.08, CELL_SIZE * 0.94);

        // Populate room grid meshes in Three.js
        for (let gy = 0; gy < gridSize; gy++) {
          for (let gx = 0; gx < gridSize; gx++) {
            const cell = grid[gy]?.[gx];
            if (!cell) continue;
            const { x, z } = convertGridTo3D(gx, gy);
            const key = `${gx},${gy}`;

            let color = (gx + gy) % 2 === 0 ? 0x1e293b : 0x161e2e;
            if (cell.type === 'obstacle') color = 0x0f172a;

            const tileMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
            const tileMesh = new THREE.Mesh(tileGeo, tileMat);
            tileMesh.position.set(x, 0.04, z);
            tileMesh.receiveShadow = true;
            tileMesh.userData = { gx, gy };
            tilesGroup.add(tileMesh);
            gridMeshes[key] = tileMesh;

            // Generate stylized obstacles
            if (cell.type === 'obstacle') {
              const obsGroup = new THREE.Group();
              const potGeo = new THREE.CylinderGeometry(0.24, 0.16, 0.35, 8);
              const potMat = new THREE.MeshStandardMaterial({ color: 0xcd7f32 });
              const pot = new THREE.Mesh(potGeo, potMat);
              pot.position.y = 0.175;
              obsGroup.add(pot);

              const leafGeo = new THREE.DodecahedronGeometry(0.28, 0);
              const leafMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, flatShading: true });
              const leaf = new THREE.Mesh(leafGeo, leafMat);
              leaf.position.set(0, 0.45, 0);
              obsGroup.add(leaf);

              obsGroup.position.set(x, 0.05, z);
              tilesGroup.add(obsGroup);
            }

            // Charge base dock
            if (cell.type === 'dock') {
              const dockModel = new THREE.Group();
              const baseGeo = new THREE.BoxGeometry(0.85, 0.05, 0.85);
              const baseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
              const base = new THREE.Mesh(baseGeo, baseMat);
              base.position.y = 0.025;
              dockModel.add(base);

              const backGeo = new THREE.BoxGeometry(0.7, 0.45, 0.24);
              const backMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });
              const back = new THREE.Mesh(backGeo, backMat);
              back.position.set(0, 0.25, -0.25);
              dockModel.add(back);

              dockModel.position.set(x, 0.05, z);
              tilesGroup.add(dockModel);
            }

            // Dust grains representation
            if (cell.type === 'dirt') {
              const dustGroup = new THREE.Group();
              dustGroup.position.set(x, 0.15, z);

              const partGeo = new THREE.OctahedronGeometry(0.06, 0);
              const partMat = new THREE.MeshStandardMaterial({ color: 0xd97706, emissive: 0xd97706, emissiveIntensity: 0.5 });
              
              for (let pi = 0; pi < 3; pi++) {
                const part = new THREE.Mesh(partGeo, partMat);
                part.position.set((Math.random() - 0.5) * 0.3, Math.random() * 0.15, (Math.random() - 0.5) * 0.3);
                dustGroup.add(part);
              }
              tilesGroup.add(dustGroup);
              dustParticlesGroup[key] = dustGroup;
            }
          }
        }

        // Create Vacuum Agent Robot Body
        const robotGroup = new THREE.Group();
        const start3D = convertGridTo3D(robotPos.x, robotPos.y);
        robotGroup.position.set(start3D.x, 0.05, start3D.z);
        scene.add(robotGroup);

        const bodyGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.14, 16);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.08;
        body.castShadow = true;
        robotGroup.add(body);

        const glowRingGeo = new THREE.RingGeometry(0.24, 0.27, 24);
        const glowRingMat = new THREE.MeshBasicMaterial({ color: 0x10b981, side: THREE.DoubleSide });
        const glowRing = new THREE.Mesh(glowRingGeo, glowRingMat);
        glowRing.rotation.x = Math.PI / 2;
        glowRing.position.y = 0.162;
        robotGroup.add(glowRing);

        const pathLineGroup = new THREE.Group();
        scene.add(pathLineGroup);

        // Path renderer
        const rebuildPaths = (path) => {
          while (pathLineGroup.children.length > 0) pathLineGroup.remove(pathLineGroup.children[0]);
          if (!path || path.length === 0 || !propsRef.current.showPaths) return;

          const pts = [];
          const curRobot = robotGroup.position.clone();
          pts.push(new THREE.Vector3(curRobot.x, 0.15, curRobot.z));

          path.forEach((n) => {
            const { x, z } = convertGridTo3D(n.x, n.y);
            pts.push(new THREE.Vector3(x, 0.15, z));
          });

          const curve = new THREE.CatmullRomCurve3(pts);
          const splineGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(path.length * 6));
          const splineMat = new THREE.LineBasicMaterial({ color: 0x818cf8, linewidth: 2 });
          pathLineGroup.add(new THREE.Line(splineGeo, splineMat));
        };

        // Raycasting clicks
        const raycaster = new THREE.Raycaster();
        const mouse2D = new THREE.Vector2();

        const handleCanvasClick = (event) => {
          const rect = containerRef.current.getBoundingClientRect();
          mouse2D.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          mouse2D.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          raycaster.setFromCamera(mouse2D, camera);
          const intersects = raycaster.intersectObjects(tilesGroup.children, true);

          if (intersects.length > 0) {
            let hitObj = intersects[0].object;
            while (hitObj && hitObj.userData && hitObj.userData.gx === undefined) hitObj = hitObj.parent;
            if (hitObj) onTileClick(hitObj.userData.gx, hitObj.userData.gy);
          }
        };

        renderer.domElement.addEventListener('click', handleCanvasClick);

        let frameId;
        const clock = new THREE.Clock();
        let currentRotation = 0;

        const animate = () => {
          frameId = requestAnimationFrame(animate);
          const elapsed = clock.getElapsedTime();
          const delta = clock.getDelta();
          const currentProps = propsRef.current;

          // Coordinates Linear Interpolation (lerp)
          const target3D = convertGridTo3D(currentProps.robotPos.x, currentProps.robotPos.y);
          const targetVec = new THREE.Vector3(target3D.x, 0.05, target3D.z);
          const diffX = targetVec.x - robotGroup.position.x;
          const diffZ = targetVec.z - robotGroup.position.z;
          const distance = Math.hypot(diffX, diffZ);

          robotGroup.position.lerp(targetVec, 0.16);

          if (distance > 0.04) {
            const targetAng = Math.atan2(diffX, diffZ);
            let deltaAng = targetAng - currentRotation;
            while (deltaAng < -Math.PI) deltaAng += Math.PI * 2;
            while (deltaAng > Math.PI) deltaAng -= Math.PI * 2;
            currentRotation += deltaAng * 0.16;
            robotGroup.rotation.y = currentRotation;
          }

          // Animate particle floating loops
          Object.keys(dustParticlesGroup).forEach((key) => {
            const dGroup = dustParticlesGroup[key];
            const [jx, jy] = key.split(',').map(Number);
            dGroup.position.y = 0.14 + Math.sin(elapsed * 2.8 + (jx + jy)) * 0.04;
          });

          // LED Status Ring Colors
          if (currentProps.battery < 25) {
            glowRingMat.color.setHex(Math.floor(elapsed * 4) % 2 === 1 ? 0xef4444 : 0x7f1d1d);
          } else {
            glowRingMat.color.setHex(0x10b981);
          }

          // Set Swept tile lighting
          for (let gy = 0; gy < gridSize; gy++) {
            for (let gx = 0; gx < gridSize; gx++) {
              const cell = grid[gy]?.[gx];
              const key = `${gx},${gy}`;
              const tMesh = gridMeshes[key];
              if (cell && tMesh) {
                const mat = tMesh.material;
                if (cell.type === 'obstacle') {
                  mat.color.setHex(0x0f172a);
                } else if (cell.type === 'dock') {
                  mat.color.setHex(0x111827);
                } else if (cell.visitedCount > 0) {
                  const colorLerped = new THREE.Color(0x1e293b);
                  colorLerped.lerp(new THREE.Color(0x0891b2), 0.16 + Math.min(5, cell.visitedCount) * 0.16);
                  mat.color.copy(colorLerped);
                } else {
                  mat.color.setHex((gx + gy) % 2 === 0 ? 0x1e293b : 0x161e2e);
                }
              }
            }
          }

          controls.update();
          renderer.render(scene, camera);
        };

        frameId = requestAnimationFrame(animate);

        const watcher = setInterval(() => {
          rebuildPaths(propsRef.current.plannedPath);
        }, 120);

        const handleResize = () => {
          if (!containerRef.current) return;
          const w = containerRef.current.clientWidth;
          const h = containerRef.current.clientHeight || 550;
          renderer.setSize(w, h);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(frameId);
          clearInterval(watcher);
          window.removeEventListener('resize', handleResize);
          renderer.dispose();
        };
      }, [gridSize, grid]);

      return (
        <div className="relative w-full h-[500px] md:h-full flex-1 bg-slate-950 flex flex-col">
          <div ref={containerRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
          <div className="absolute top-4 left-4 p-3 bg-slate-950/85 backdrop-blur-md rounded-xl border border-slate-800/80 pointer-events-none flex flex-col gap-2 shadow-xl">
            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider font-mono">Legend</span>
            <div className="grid grid-cols-2 gap-3 text-[11px] text-slate-300">
              <div className="flex items-center gap-1.5">
                <div className="w-2.5 h-2.5 rounded bg-amber-500" />
                <span>Dust Particles</span>
              </div>
              <div className="flex items-center gap-1.5">
                <div className="w-2.5 h-2.5 rounded bg-indigo-500" />
                <span>Planned Course</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- Core Master Container App ---
    function App() {
      const [gridSize, setGridSize] = useState(DEFAULT_GRID_SIZE);
      const [grid, setGrid] = useState([]);
      const [robotPos, setRobotPos] = useState({ x: 1, y: 1 });
      const [dockPos, setDockPos] = useState({ x: 0, y: 0 });
      const [agentType, setAgentType] = useState('bfs');
      const [isPlaying, setIsPlaying] = useState(false);
      const [battery, setBattery] = useState(INITIAL_BATTERY);
      const [stats, setStats] = useState({ stepsCount: 0, dustCollected: 0, batteryDepletedTimes: 0 });
      const [editMode, setEditMode] = useState('dirt');

      const DEFAULT_GRID_SIZE = 8;
      const INITIAL_BATTERY = 100;

      // Construct room grid structure
      const buildRoomGrid = useCallback((size, dock, robot) => {
        const rows = [];
        for (let y = 0; y < size; y++) {
          const cols = [];
          for (let x = 0; x < size; x++) {
            let type = 'empty';
            let dustAmount = 0;

            if (x === dock.x && y === dock.y) type = 'dock';
            else if ((x === 4 && y >= 1 && y <= 2) || (x === 2 && y === 4)) type = 'obstacle';
            else if (Math.random() < 0.22 && (x !== robot.x || y !== robot.y)) {
              type = 'dirt';
              dustAmount = 1.0;
            }

            cols.push({ x, y, type, dustAmount, visitedCount: (x === robot.x && y === robot.y) ? 1 : 0 });
          }
          rows.push(cols);
        }
        return rows;
      }, []);

      const resetSimulation = useCallback(() => {
        setIsPlaying(false);
        setBattery(INITIAL_BATTERY);
        const defDock = { x: 0, y: 0 };
        const defRobot = { x: 1, y: 1 };
        setDockPos(defDock);
        setRobotPos(defRobot);
        setGrid(buildRoomGrid(gridSize, defDock, defRobot));
        setStats({ stepsCount: 0, dustCollected: 0, batteryDepletedTimes: 0 });
      }, [gridSize, buildRoomGrid]);

      useEffect(() => { resetSimulation(); }, [gridSize]);

      const handleTileClick = (gx, gy) => {
        const copy = grid.map(row => row.map(cell => ({ ...cell })));
        const cell = copy[gy]?.[gx];
        if (!cell) return;

        if (editMode === 'dirt') {
          if (cell.type === 'empty') { cell.type = 'dirt'; cell.dustAmount = 1.0; }
          else if (cell.type === 'dirt') { cell.type = 'empty'; cell.dustAmount = 0; }
        } else if (editMode === 'obstacle') {
          cell.type = cell.type === 'obstacle' ? 'empty' : 'obstacle';
        } else if (editMode === 'dock') {
          copy[dockPos.y][dockPos.x].type = 'empty';
          cell.type = 'dock';
          setDockPos({ x: gx, y: gy });
        } else if (editMode === 'robot') {
          if (cell.type !== 'obstacle') setRobotPos({ x: gx, y: gy });
        }
        setGrid(copy);
      };

      // Main Interval Clock Tick logic loop
      useEffect(() => {
        if (!isPlaying || grid.length === 0) return;

        const interval = setInterval(() => {
          if (battery <= 0) {
            setIsPlaying(false);
            return;
          }

          const currentCell = grid[robotPos.y]?.[robotPos.x];

          // Charge base algorithm recharge loop
          if (currentCell && currentCell.type === 'dock' && battery < 100) {
            setBattery(prev => Math.min(100, prev + 15));
            return;
          }

          // Algorithm choice
          let nextAction = { action: 'noop' };
          let isLow = battery < 25;

          if (agentType === 'reflex') {
            if (currentCell.type === 'dirt' || currentCell.dustAmount > 0.05) {
              nextAction = { action: 'suck' };
            } else {
              const neighbors = [];
              for (const d of DIRECTIONS) {
                const nx = robotPos.x + d.dx, ny = robotPos.y + d.dy;
                if (ny >= 0 && ny < gridSize && nx >= 0 && nx < gridSize && grid[ny][nx].type !== 'obstacle') {
                  neighbors.push({ x: nx, y: ny });
                }
              }
              if (neighbors.length > 0) {
                nextAction = { action: 'move', nextPos: neighbors[Math.floor(Math.random() * neighbors.length)] };
              }
            }
          } else {
            // Search or Model state based rule
            if (currentCell && (currentCell.type === 'dirt' || currentCell.dustAmount > 0.05)) {
              nextAction = { action: 'suck' };
            } else {
              const criteria = isLow ? (c => c.type === 'dock') : (c => c.type === 'dirt');
              const path = findShortestPathBFS(robotPos, criteria, grid, gridSize);

              if (path && path.length > 0) {
                nextAction = { action: 'move', nextPos: path[0] };
              } else {
                // Return to base or idle wander
                const homePath = findShortestPathBFS(robotPos, c => c.type === 'dock', grid, gridSize);
                if (homePath && homePath.length > 0) nextAction = { action: 'move', nextPos: homePath[0] };
              }
            }
          }

          // Execute selected action
          const copy = grid.map(row => row.map(cell => ({ ...cell })));
          if (nextAction.action === 'suck') {
            copy[robotPos.y][robotPos.x].type = 'empty';
            copy[robotPos.y][robotPos.x].dustAmount = 0;
            setGrid(copy);
            setBattery(b => Math.max(0, b - 1.5));
            setStats(s => ({ ...s, dustCollected: s.dustCollected + 1 }));
          } else if (nextAction.action === 'move' && nextAction.nextPos) {
            const next = nextAction.nextPos;
            copy[next.y][next.x].visitedCount += 1;
            setRobotPos(next);
            setGrid(copy);
            setBattery(b => Math.max(0, b - 0.5));
            setStats(s => ({ ...s, stepsCount: s.stepsCount + 1 }));
          }

        }, 220);

        return () => clearInterval(interval);
      }, [isPlaying, grid, robotPos, battery, agentType, dockPos, gridSize]);

      return (
        <div className="flex flex-col md:flex-row h-screen w-screen bg-slate-950 overflow-hidden">
          
          {/* Controls Sidebar */}
          <div className="flex flex-col h-full bg-slate-900 border-r border-slate-800 text-slate-100 overflow-y-auto w-full md:w-[380px] p-6 gap-5 shrink-0">
            <div>
              <h1 className="text-xl font-bold bg-gradient-to-r from-white to-indigo-400 bg-clip-text text-transparent">
                AI Vacuum Agent
              </h1>
              <p className="text-xs text-slate-400">Intelligent 3D Web Agent Demo</p>
            </div>

            {/* Sim Control */}
            <div className="flex flex-col gap-3 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
              <div className="grid grid-cols-2 gap-2">
                <button
                  onClick={() => setIsPlaying(!isPlaying)}
                  className={`py-2 px-4 rounded-lg font-medium text-sm transition-colors text-center cursor-pointer ${
                    isPlaying ? 'bg-rose-600/30 text-rose-300 border border-rose-500/30' : 'bg-emerald-600 text-white'
                  }`}
                >
                  {isPlaying ? 'Pause Simulation' : 'Start Vacuum AI'}
                </button>
                <button onClick={resetSimulation} className="bg-slate-800 border border-slate-700 py-2 px-4 rounded-lg text-sm cursor-pointer">
                  Reset Grid
                </button>
              </div>

              {/* Grid dimension adjusters */}
              <div>
                <span className="text-xs text-slate-400 block mb-1">Environment Dimensions</span>
                <div className="grid grid-cols-3 gap-1.5 text-xs font-mono">
                  {[6, 8, 10].map(size => (
                    <button
                      key={size}
                      onClick={() => setGridSize(size)}
                      className={`py-1 rounded border cursor-pointer ${gridSize === size ? 'bg-indigo-600/30 text-indigo-300 border-indigo-500' : 'bg-slate-900 border-slate-800'}`}
                    >
                      {size}x{size}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* AI strategies selectors */}
            <div className="flex flex-col gap-2">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-widest block mb-1">AI Strategy</span>
              
              <button
                onClick={() => setAgentType('bfs')}
                className={`p-3 rounded-xl text-left border cursor-pointer ${agentType === 'bfs' ? 'bg-indigo-600/10 border-indigo-500 text-indigo-200' : 'bg-slate-950/20 border-slate-800'}`}
              >
                <div className="font-bold text-sm">Pathfinding Search Agent (BFS)</div>
                <div className="text-xs text-slate-400">Computes the absolute shortest path to closest dust cell.</div>
              </button>

              <button
                onClick={() => setAgentType('reflex')}
                className={`p-3 rounded-xl text-left border cursor-pointer ${agentType === 'reflex' ? 'bg-indigo-600/10 border-indigo-500 text-indigo-200' : 'bg-slate-950/20 border-slate-800'}`}
              >
                <div className="font-bold text-sm">Simple Reflex Agent</div>
                <div className="text-xs text-slate-400">Pure action condition table. Moves completely randomly without goals.</div>
              </button>
            </div>

            {/* Brush Edit options */}
            <div className="bg-slate-950/40 border border-slate-800/80 p-4 rounded-xl flex flex-col gap-2">
              <span className="text-xs font-semibold text-slate-400 uppercase tracking-widest block">Layout Editor Paint</span>
              <div className="grid grid-cols-2 gap-2 text-xs">
                {[['dirt', 'Place Dust'], ['obstacle', 'Place Column']].map(([mode, label]) => (
                  <button
                    key={mode}
                    onClick={() => setEditMode(mode)}
                    className={`py-1.5 px-2 rounded-lg border text-center transition-colors cursor-pointer ${editMode === mode ? 'bg-amber-600/25 text-amber-300 border-amber-500' : 'bg-slate-900 border-slate-800'}`}
                  >
                    {label}
                  </button>
                ))}
              </div>
            </div>

            {/* Performance Telemetry panel */}
            <div className="mt-auto pt-4 border-t border-slate-800 flex flex-col gap-3">
              <div className="bg-slate-950/50 p-3 rounded-lg border border-slate-800/50">
                <span className="text-[10px] text-slate-400 uppercase tracking-wider block">Robot Power Level</span>
                <div className="flex items-center gap-2 mt-1">
                  <div className="flex-1 bg-slate-800 h-2.5 rounded-full overflow-hidden">
                    <div className="bg-emerald-500 h-full transition-all duration-300" style={{ width: `${battery}%` }} />
                  </div>
                  <span className="text-xs font-mono font-bold text-emerald-400">{battery.toFixed(0)}%</span>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2 text-center">
                <div className="bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/50">
                  <span className="text-[9px] text-slate-400 block uppercase">Steps Made</span>
                  <span className="text-base font-bold font-mono text-slate-200">{stats.stepsCount}</span>
                </div>
                <div className="bg-slate-950/50 p-2.5 rounded-lg border border-slate-800/50">
                  <span className="text-[9px] text-slate-400 block uppercase">Dust Cleared</span>
                  <span className="text-base font-bold font-mono text-amber-400">{stats.dustCollected}</span>
                </div>
              </div>
            </div>
          </div>

          {/* Three.js viewport parent */}
          <div className="flex-1 min-h-0 relative">
            <VacuumCanvas
              grid={grid}
              gridSize={gridSize}
              robotPos={robotPos}
              dockPos={dockPos}
              plannedPath={null}
              battery={battery}
              showPaths={true}
              showQValues={false}
              onTileClick={handleTileClick}
              agentType={agentType}
            />
          </div>
        </div>
      );
    }

    // Mount core app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
